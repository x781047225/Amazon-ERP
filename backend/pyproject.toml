[project]
name = "amazon-erp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.5,<6",
    "requests[socks]>=2.32,<3",
    "pydantic-settings>=2.8,<3",
    "alembic>=1.15,<2",
    "jsonschema>=4.23,<5",
    "pillow>=11,<13",
    "openpyxl>=3.1,<4",
    "reportlab>=4,<5",
    "pypdf>=5,<7",
    "cryptography>=44,<47",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
